name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports
          retention-days: 7

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  api-security-scan:
    name: API Security Scan (DAST)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      # Запускаем приложение в фоне (убедитесь, что используется профиль без внешней БД или с H2)
      - name: Start Spring Boot application
        run: |
          java -jar target/*.jar --spring.profiles.active=DEV &
          echo "Waiting for API to start..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/v3/api-docs > /dev/null; do sleep 2; done'

      # Сканируем API через OWASP ZAP по OpenAPI спецификации
      - name: OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:8080/v3/api-docs'
          format: 'openapi'
          cmd_options: '-a'

      # Сохраняем HTML-отчет сканера
      - name: Upload ZAP Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report
          path: report_html.html
          retention-days: 7