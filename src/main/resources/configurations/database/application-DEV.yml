spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:~/testdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password: password
  jpa:
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true