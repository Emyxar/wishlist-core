server:
  port: 8080

spring:
  application:
    name: wishlist-service

  config:
    import:
      - configurations/database/application-PROM.yml
      - configurations/storage/application-PROM.yml
      - configurations/mail/application-PROM.yml

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:5MB}
      max-request-size: ${MAX_FILE_SIZE:1MB}

jwt:
  secret: ${JWT_SECRET}
  accessToken:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refreshToken:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
  resetPasswordToken:
    expiration: ${JWT_RESET_PASSWORD_TOKEN_EXPIRATION}

logging:
  level:
    root: ${LOG_LEVEL_ROOT}
    org.eclipse.jetty: ${LOG_LEVEL_JETTY}

frontend:
  url: ${FRONTEND_URL}