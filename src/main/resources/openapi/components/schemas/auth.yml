RegisterV1Request:
  type: object
  required:
    - email
    - fullName
    - password
    - confirmPassword
  properties:
    email:
      type: string
      example: example@email.com
      format: email
    fullName:
      type: string
      maxLength: 254
      minLength: 1
    password:
      type: string
      maxLength: 254
      minLength: 8
    confirmPassword:
      type: string
      maxLength: 254
      minLength: 8

RegisterV1Response:
  type: object
  required:
    - id
  properties:
    id:
      type: string

ApiRegisterV1Response:
  type: object
  required:
    - status
    - data
    - error
    - timestamp
  properties:
    status:
      type: boolean
    data:
      $ref: '#/RegisterV1Response'
    error:
      $ref: './common.yml#/ApiError'
    timestamp:
      type: string
      format: date-time

LoginV1Request:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      example: example@email.com
      format: email
    password:
      type: string
      maxLength: 254
      minLength: 8

LoginV1Response:
  type: object
  required:
    - id
    - accessToken
    - refreshToken
  properties:
    id:
      type: string
    accessToken:
      type: string
    refreshToken:
      type: string

ApiLoginV1Response:
  type: object
  required:
    - status
    - data
    - error
    - timestamp
  properties:
    status:
      type: boolean
    data:
      $ref: '#/LoginV1Response'
    error:
      $ref: './common.yml#/ApiError'
    timestamp:
      type: string
      format: date-time

