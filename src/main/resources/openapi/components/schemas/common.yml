ApiError:
  type: object
  nullable: true
  required:
    - code
    - message
  properties:
    code:
      type: string
      example: NOT_FOUND
    message:
      type: string
      example: Пользователь не найден
    details:
      type: object
      nullable: true
      additionalProperties: true

ApiErrorResponse:
  type: object
  properties:
    status:
      type: boolean
    data:
      type: object
      nullable: true
    error:
      $ref: '#/ApiError'
    timestamp:
      type: string
      format: date-time