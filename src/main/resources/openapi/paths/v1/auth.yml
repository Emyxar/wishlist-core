register:
  post:
    tags:
      - auth
    summary: Регистрация пользователя
    operationId: v1RegistrationApi
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/auth.yml#/RegisterV1Request'
    responses:
      '200':
        description: Успешная регистрация пользователя
        content:
          application/json:
            schema:
              $ref: '../../components/schemas/auth.yml#/ApiRegisterV1Response'
      '400':
        $ref: '../../components/responses/errors.yml#/BadRequest'
      '422':
        $ref: '../../components/responses/errors.yml#/UnprocessableEntity'
      '500':
        $ref: '../../components/responses/errors.yml#/InternalServerError'

login:
  post:
    tags:
      - auth
    summary: Авторизация пользователя
    operationId: v1LoginApi
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/auth.yml#/LoginV1Request'
