server:
  port: 8080

spring:
  application:
    name: wishlist-service

  config:
    import:
      - configurations/database/application-DEV.yml
      - configurations/storage/application-DEV.yml
      - configurations/mail/application-DEV.yml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

jwt:
  secret: tyWPaYHl0uI40q6No9l6o9ZLcgLXEqi9qe8zvwTOq28=
  accessToken:
    expiration: 900000
  refreshToken:
    expiration: 86400000
  resetPasswordToken:
    expiration: 300000

logging:
  level:
    root: INFO
    org.eclipse.jetty: INFO

frontend:
  url: "http://localhost:3000"

app:
  security:
    public-urls:
      - "/error"
      - "/api/v1/auth/**"
      - "/v3/api-docs/**"
      - "/swagger-ui/**"